version: '3.8'

services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - disasterscout

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - disasterscout

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - disasterscout

networks:
  disasterscout:
    driver: bridge
